; Generated by native/generate_catalog.py; edit native/catalog.json.
[Patches]
; Faster texture conversion in all four games, with the same pixel output; on by default.
FastTextureConversion=1
; Re;Birth3/Sega: reduce GPU waits when creating face textures; off by default.
FastFaceTextureCreation=0
; Speed up story scenes on supported game versions; off by default.
AdvFastForward=0
; Activate the game's story skip once per eligible scene; off by default.
AdvAutoSkip=0
; Skip automatic tutorials; Help pages opened from the menu stay available.
SkipTutorials=1
; Re;Birth3 only: shorten the wait after battle characters are ready from 21 frames to one.
BattleLoadDelaySkip=0
; Re;Birth2 only: skip chapter titles and N-GEAR intros, independently of story skip.
SkipChapterIntros=0
; Sega Hard Girls only: fix the extra dungeon movement step on frames shorter than one movement step.
DungeonMovementFix=1
; Use prepared assets when available; otherwise load from the original archives.
UncompressedAssets=0
; Re;Birth3 only: skip all of Nepstation using the game's skip and cleanup; off by default, independent of story auto-skip.
NepstationSkip=0
; Trim checked quiet voice endings in Re;Birth1 JP/EN and Re;Birth2 JP, and silent sound-effect endings in Re;Birth2/3. Original audio files stay intact; on by default.
TrimSilentAudioTails=1
; Prevent an enemy-turn freeze caused by battle planning finishing early; on by default.
EnemyTurnSoftlockFix=1
; Allow saving from the System menu inside dungeons; off by default.
SaveAnywhere=0
; Load loose files before prepared assets and original archives; off by default.
LooseFiles=0
; Loose-file root, relative to the game EXE folder or an absolute path.
LooseFileDirectory=loosefiles

[UncompressedAssets]
; Relative paths start at the folder containing the game EXE, including Re;Birth3.
Directory=rebirths-speedrun-patch\assets
; Diagnose changed manifests, original archive indexes and opened prepared assets. Can slow loading.
Verify=0

[AudioTail]
; Diagnose changed voice/effect banks by hashing their complete contents. Can substantially delay startup.
VerifyBanks=0
